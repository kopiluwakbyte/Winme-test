<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winme - Chatwoot Live Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header / Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          W
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">Winme Customer Care</h1>
          <p class="text-xs text-slate-500">Chatwoot Widget Integration Test</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="sdk-status-badge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">
          <span class="w-2 h-2 mr-1.5 rounded-full bg-amber-500 animate-pulse"></span>
          Menghubungkan ke Winpay Help...
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Hero / Card -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 sm:p-8 text-white shadow-lg">
      <div class="max-w-2xl">
        <span class="inline-block px-2.5 py-1 bg-white/20 rounded-md text-xs font-semibold tracking-wide uppercase mb-3">
          Environment Test
        </span>
        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Halaman Uji Coba Chatwoot Winme</h2>
        <p class="mt-2 text-blue-100 text-sm sm:text-base leading-relaxed">
          Halaman ini dibuat khusus untuk memvalidasi integrasi Chatwoot SDK (<code class="bg-black/20 px-1.5 py-0.5 rounded text-white text-xs">help.winpay.id</code>) sebelum digunakan pada aplikasi produksi.
        </p>
        <div class="mt-5 flex flex-wrap gap-3">
          <button onclick="openChat()" class="px-4 py-2 bg-white text-blue-700 font-semibold rounded-lg shadow-sm hover:bg-blue-50 transition active:scale-95 text-sm flex items-center gap-2">
            <span>💬 Buka Widget Chat</span>
          </button>
          <button onclick="toggleChat()" class="px-4 py-2 bg-blue-800/60 hover:bg-blue-800/80 text-white font-medium rounded-lg transition active:scale-95 text-sm border border-white/20">
            Toggle Buka / Tutup
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Script Tombol Kontrol Widget -->
  <script>
    function isChatwootReady() {
      return typeof window.$chatwoot !== 'undefined' && window.$chatwoot !== null;
    }

    function openChat() {
      if (isChatwootReady()) {
        window.$chatwoot.toggle('open');
      }
    }

    function toggleChat() {
      if (isChatwootReady()) {
        window.$chatwoot.toggle();
      }
    }

    // Status SDK Ready
    window.addEventListener("chatwoot:ready", function () {
      var badge = document.getElementById('sdk-status-badge');
      if (badge) {
        badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200";
        badge.innerHTML = '<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-500"></span> SDK Siap (Online)';
      }
    });
  </script>

  <!-- Chatwoot SDK Script -->
  <script>
    (function(d,t) {
      var BASE_URL="https://help.winpay.id";
      var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
      g.src=BASE_URL+"/packs/js/sdk.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g,s);
      g.onload=function(){
        window.chatwootSDK.run({
          websiteToken: 'z9g3eZMV5tU41UciEnrEMzGp',
          baseUrl: BASE_URL
        })
      }
    })(document,"script");
  </script>
</body>
</html>
